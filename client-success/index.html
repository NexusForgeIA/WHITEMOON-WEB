<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Client Success · WhiteMoon</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080d;--purple:#7c4dff;--accent:#00d4aa;--light:#f0f0f5;
    --panel:#11111a;--panel-2:#16161f;--line:#23232f;--muted:#8a8a9e;
    --danger:#ff5d6c;--warn:#ffb454;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--light);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 64px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--purple),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:#fff}
  .brand h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:.74rem}
  .btn{font-family:inherit;font-weight:600;font-size:.85rem;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;transition:transform .12s,opacity .12s;display:inline-flex;align-items:center;gap:8px;color:#fff}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--purple),#9d70ff)}
  .btn.accent{background:linear-gradient(135deg,var(--accent),#16e6bb);color:#04201a}
  .btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--light)}
  .btn.sm{padding:7px 12px;font-size:.78rem;border-radius:8px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat .n{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
  .stat .l{color:var(--muted);font-size:.76rem;margin-top:2px}
  .stat.danger .n{color:var(--danger)}
  .stat.warn .n{color:var(--warn)}
  .stat.accent .n{color:var(--accent)}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .chip{font-size:.78rem;font-weight:600;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer}
  .chip.on{border-color:var(--purple);color:#c2afff;background:rgba(124,77,255,.14)}
  .clients{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:14px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
  .card.roja{border-left-color:var(--danger)}
  .card.amarilla{border-left-color:var(--warn)}
  .card.verde{border-left-color:var(--accent)}
  .card .name{font-weight:700;font-size:.98rem;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .card .motivo{color:var(--muted);font-size:.8rem;margin-top:4px}
  .card .meta{color:var(--muted);font-size:.76rem;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tag{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);text-transform:capitalize}
  .tag.pack{background:rgba(124,77,255,.14);border-color:rgba(124,77,255,.4);color:#b9a2ff}
  .tag.sector{background:rgba(0,212,170,.12);border-color:rgba(0,212,170,.35);color:#5ff0d3}
  .revchip{font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(0,212,170,.14);color:var(--accent)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .sem{font-size:1.25rem}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;border:1px dashed var(--line);border-radius:14px}
  .loading{color:var(--muted);text-align:center;padding:40px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:.85rem;z-index:90;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.ok{border-color:rgba(0,212,170,.5)}
  .toast.err{border-color:rgba(255,93,108,.5)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="dot">W</div>
      <div>
        <h1>Client Success</h1>
        <small>Salud de clientes · detección de churn</small>
      </div>
    </div>
    <button class="btn ghost" id="btnReload">↻ Refrescar</button>
  </header>

  <div class="stats">
    <div class="stat danger"><div class="n" id="stRoja">–</div><div class="l">🔴 En riesgo</div></div>
    <div class="stat warn"><div class="n" id="stAmarilla">–</div><div class="l">🟡 Oportunidades upsell</div></div>
    <div class="stat accent"><div class="n" id="stVerde">–</div><div class="l">🟢 Saludables</div></div>
    <div class="stat"><div class="n" id="stTotal">–</div><div class="l">Total clientes</div></div>
  </div>

  <div class="filters">
    <span class="chip on" data-f="all">Todos</span>
    <span class="chip" data-f="roja">🔴 Riesgo</span>
    <span class="chip" data-f="amarilla">🟡 Upsell</span>
    <span class="chip" data-f="verde">🟢 Saludables</span>
  </div>

  <div class="clients" id="list"><div class="loading">Cargando…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA = "https://mlaqtniujnvfxcvcourm.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sYXF0bml1am52ZnhjdmNvdXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzUyMzIsImV4cCI6MjA5MzQxMTIzMn0.Neh7VUS8ADsxf0DPab0JoJyGXOAXnLIaXzXbKzj2BGs";
const REST = SUPA + "/rest/v1/";
const FN = SUPA + "/functions/v1/";
const H = { apikey: ANON, Authorization: "Bearer " + ANON, "Content-Type": "application/json" };
const SEM = { roja: "🔴", amarilla: "🟡", verde: "🟢" };

let ROWS = [];
let FILTER = "all";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toast(msg, kind){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show " + (kind || "");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = "toast", 2800);
}

async function load(){
  try{
    const r = await fetch(REST + "rpc/check_client_health", { method:"POST", headers:H, body:"{}" });
    if(!r.ok) throw new Error("HTTP " + r.status + " — " + await r.text());
    ROWS = await r.json() || [];
    render();
  }catch(e){
    $("#list").innerHTML = '<div class="empty">Error cargando salud.<br><small>' + esc(e.message) + '</small></div>';
  }
}

function render(){
  const roja = ROWS.filter(r => r.alerta === "roja").length;
  const amar = ROWS.filter(r => r.alerta === "amarilla").length;
  const verde = ROWS.filter(r => r.alerta === "verde").length;
  $("#stRoja").textContent = roja;
  $("#stAmarilla").textContent = amar;
  $("#stVerde").textContent = verde;
  $("#stTotal").textContent = ROWS.length;

  const rows = FILTER === "all" ? ROWS : ROWS.filter(r => r.alerta === FILTER);
  const list = $("#list");
  if(!rows.length){
    list.innerHTML = '<div class="empty">Sin clientes en esta vista.</div>';
    return;
  }
  list.innerHTML = rows.map(r => {
    const dias = r.alerta === "amarilla" ? (r.dias_activo != null ? r.dias_activo + " días activo" : "")
              : (r.dias_en_step != null ? r.dias_en_step + " días en step" : "");
    const rev = r.revisado_at ? '<span class="revchip">✓ Revisado ' + new Date(r.revisado_at).toLocaleDateString("es-ES") + '</span>' : "";
    return '<div class="card ' + esc(r.alerta) + '" data-id="' + esc(r.cliente_id) + '">' +
        '<div>' +
          '<div class="name"><span class="sem">' + (SEM[r.alerta]||"") + '</span>' + esc(r.cliente_nombre) + rev + '</div>' +
          '<div class="motivo">' + esc(r.motivo) + '</div>' +
          '<div class="meta">' +
            (r.pack ? '<span class="tag pack">' + esc(r.pack) + '</span>' : '') +
            (r.sector ? '<span class="tag sector">' + esc(r.sector) + '</span>' : '') +
            (r.step_actual ? '<span>📍 ' + esc(r.step_actual) + '</span>' : '') +
            (dias ? '<span>⏱ ' + esc(dias) + '</span>' : '') +
            (r.alerta === "amarilla" && r.siguiente_pack ? '<span>⬆ ' + esc(r.siguiente_pack) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="actions">' +
          (r.alerta !== "verde" ? '<button class="btn primary sm" data-act="alert">Enviar alerta</button>' : '') +
          '<button class="btn ghost sm" data-act="rev">Marcar revisado</button>' +
        '</div>' +
      '</div>';
  }).join("");

  list.querySelectorAll(".card").forEach(card => {
    const id = card.dataset.id;
    const a = card.querySelector('[data-act="alert"]');
    const rev = card.querySelector('[data-act="rev"]');
    if(a) a.addEventListener("click", () => sendAlert(id, a));
    if(rev) rev.addEventListener("click", () => markRevisado(id, rev));
  });
}

async function sendAlert(id, btn){
  btn.disabled = true; const prev = btn.textContent; btn.textContent = "Enviando…";
  try{
    const r = await fetch(FN + "client-success-notify", { method:"POST", headers:H, body: JSON.stringify({ cliente_id: id }) });
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.error || ("HTTP " + r.status));
    const sent = (d.results || []).some(x => x.sent);
    toast(sent ? "Alerta enviada por WhatsApp ✅" : "Procesado (WhatsApp no confirmado)", sent ? "ok" : "err");
  }catch(e){ toast("Error: " + e.message, "err"); }
  finally{ btn.disabled = false; btn.textContent = prev; }
}

async function markRevisado(id, btn){
  btn.disabled = true;
  try{
    await fetch(REST + "onboarding_clientes?id=eq." + id, {
      method:"PATCH",
      headers:{ ...H, Prefer:"return=minimal" },
      body: JSON.stringify({ success_revisado_at: new Date().toISOString() }),
    });
    const row = ROWS.find(x => x.cliente_id === id);
    if(row) row.revisado_at = new Date().toISOString();
    toast("Marcado como revisado", "ok");
    render();
  }catch(e){ toast("Error: " + e.message, "err"); btn.disabled = false; }
}

$("#btnReload").addEventListener("click", load);
document.querySelectorAll(".chip").forEach(c =>
  c.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    c.classList.add("on");
    FILTER = c.dataset.f;
    render();
  }));

load();
</script>
</body>
</html>
