<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="WhiteMoon Agencia IA — Chatbot IA para Talleres y Automoción">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#5c35cc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#9d70ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; }
      .sector { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; }
      .tagline { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Logo mark: stylised crescent moon -->
  <g transform="translate(80,80)">
    <circle cx="32" cy="32" r="32" fill="#FFFFFF"/>
    <circle cx="44" cy="28" r="26" fill="#7c4dff"/>
  </g>
  <text x="170" y="125" class="brand" fill="#FFFFFF" font-size="48" letter-spacing="-1">WhiteMoon</text>
  <text x="170" y="160" class="tagline" fill="#e3d7ff" font-size="20" letter-spacing="2">AGENCIA IA</text>
  <!-- Sector -->
  <text x="80" y="370" class="sector" fill="#FFFFFF" font-size="76" letter-spacing="-2">Chatbot IA para</text>
  <text x="80" y="460" class="sector" fill="#FFFFFF" font-size="86" letter-spacing="-2.5">Talleres y Automoción</text>
  <!-- Tagline -->
  <line x1="80" y1="520" x2="180" y2="520" stroke="#FFFFFF" stroke-width="3"/>
  <text x="80" y="568" class="tagline" fill="#e3d7ff" font-size="26" letter-spacing="3">CHATBOT IA · MAJADAHONDA · MADRID</text>
</svg>
