name: SEO Guardian

on:
  schedule:
    # Lunes a las 07:00 UTC ≈ 08:00 Europe/Madrid (invierno) / 09:00 (verano)
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Fuerza el runtime Node.js 24 en las JavaScript actions (checkout, setup-python,
# upload-artifact) para compatibilidad con el runner actual.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seo-guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Run SEO Guardian
        env:
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python seo_guardian.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-guardian-report
          path: seo-guardian-report.md
          retention-days: 30
