name: SEO Guardian

on:
  schedule:
    # Lunes a las 07:00 UTC ≈ 08:00 Europe/Madrid (invierno) / 09:00 (verano)
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      forzar_aviso_geo:
        description: 'Forzar el aviso de frescura GEO (para probar que llega a Telegram)'
        type: boolean
        default: false

# Fuerza el runtime Node.js 24 en las JavaScript actions (checkout, setup-python,
# upload-artifact) para compatibilidad con el runner actual.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seo-guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Run SEO Guardian
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python seo_guardian.py

      # Aviso de caducidad del banco de pruebas GEO. Va SOLO en el run
      # semanal: no esta en seo-guardian-pr.yml, asi que nunca bloquea un
      # merge. `continue-on-error` ademas garantiza que un fallo de red al
      # hablar con Telegram no tumbe el job.
      - name: Aviso de frescura del banco de pruebas GEO
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Con el input marcado se usa un limite de -1 dia: cualquier fecha
        # queda "caducada" y el aviso se envia, sin tocar el marcador real.
        run: |
          if [ "${{ inputs.forzar_aviso_geo }}" = "true" ]; then
            python scripts/geo_freshness.py --limite -1
          else
            python scripts/geo_freshness.py
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-guardian-report
          path: seo-guardian-report.md
          retention-days: 30

      # Falla el job SOLO si hay errores críticos (los warnings no fallan).
      # Va después de subir el report para que el artefacto se conserve aunque falle.
      - name: Fail on critical errors
        if: always()
        run: |
          if [ ! -f seo-guardian-report.md ]; then
            echo "No se generó seo-guardian-report.md (fallo previo); nada que evaluar."
            exit 0
          fi
          crit=$(grep -oE '\*\*[0-9]+\*\* errores' seo-guardian-report.md | grep -oE '[0-9]+' | head -1)
          crit=${crit:-0}
          echo "Errores críticos detectados: $crit"
          if [ "$crit" -gt 0 ]; then
            echo "::error::SEO Guardian detectó $crit errores críticos."
            exit 1
          fi
          echo "Sin errores críticos. Los warnings no fallan el job."
