<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Propuestas IA · WhiteMoon</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080d;--purple:#7c4dff;--accent:#00d4aa;--light:#f0f0f5;
    --panel:#11111a;--panel-2:#16161f;--line:#23232f;--muted:#8a8a9e;
    --danger:#ff5d6c;--warn:#ffb454;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--light);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1280px;margin:0 auto;padding:24px 18px 64px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--purple),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .brand h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:.74rem}

  .grid{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .card h2{font-size:.95rem;font-weight:700;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:5px;font-weight:500}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--light);font-family:inherit;font-size:.88rem;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple)}
  .field textarea{resize:vertical;min-height:70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{font-family:inherit;font-weight:600;font-size:.85rem;border:none;border-radius:10px;padding:11px 16px;cursor:pointer;transition:transform .12s,opacity .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;width:100%}
  .btn:hover{transform:translateY(-1px)}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
  .btn.primary{background:linear-gradient(135deg,var(--purple),#9d70ff)}
  .btn.accent{background:linear-gradient(135deg,var(--accent),#16e6bb);color:#04201a}
  .btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--light)}
  .btn.sm{width:auto;padding:7px 12px;font-size:.78rem;border-radius:8px}

  .preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .preview-head .acts{display:flex;gap:8px;flex-wrap:wrap}
  .frame-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:680px}
  iframe{width:100%;height:100%;border:none;background:#fff}
  .ph{height:680px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center;gap:10px;border:1px dashed var(--line);border-radius:12px}
  .ph .big{font-size:2.4rem}

  .section-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 12px 2px;font-weight:600}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .row .info{flex:1;min-width:180px}
  .row .nm{font-weight:700;font-size:.92rem}
  .row .mt{color:var(--muted);font-size:.76rem;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .tag{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);text-transform:capitalize}
  .tag.pack{background:rgba(124,77,255,.14);border-color:rgba(124,77,255,.4);color:#b9a2ff}
  .tag.sector{background:rgba(0,212,170,.12);border-color:rgba(0,212,170,.35);color:#5ff0d3}
  .estado-sel{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--light);font-family:inherit;font-size:.76rem;padding:6px 8px}
  .estado-sel.borrador{color:var(--muted)}
  .estado-sel.enviada{color:#c2afff}
  .estado-sel.aceptada{color:var(--accent)}
  .estado-sel.rechazada{color:var(--danger)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:.85rem;z-index:90;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.ok{border-color:rgba(0,212,170,.5)}
  .toast.err{border-color:rgba(255,93,108,.5)}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{color:var(--muted);text-align:center;padding:24px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="dot">W</div>
      <div><h1>Propuestas IA</h1><small>Propuesta comercial personalizada en 30 segundos</small></div>
    </div>
  </header>

  <div class="grid">
    <!-- Form -->
    <div class="card">
      <h2>Generar propuesta</h2>
      <form id="form">
        <div class="grid2">
          <div class="field"><label>Nombre cliente *</label><input name="nombre_cliente" required placeholder="Ana García"></div>
          <div class="field"><label>Empresa *</label><input name="empresa" required placeholder="Clínica Dental Sonríe"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Sector</label>
            <select name="sector" required>
              <option value="" disabled selected>Elegir…</option>
              <option value="dental">Dental</option>
              <option value="legal">Legal</option>
              <option value="abogados">Abogados</option>
              <option value="restaurante">Restaurante</option>
              <option value="gestoria">Gestoría</option>
              <option value="clinica">Clínica</option>
              <option value="inmobiliaria">Inmobiliaria</option>
              <option value="gimnasio">Gimnasio</option>
              <option value="peluqueria">Peluquería</option>
              <option value="veterinaria">Veterinaria</option>
              <option value="formacion">Formación</option>
              <option value="taller">Taller</option>
              <option value="podologia">Podología</option>
              <option value="automovil">Automóvil</option>
            </select>
          </div>
          <div class="field"><label>Pack</label>
            <select name="pack" required>
              <option value="" disabled selected>Elegir…</option>
              <option value="spark">Spark · 499€ + 199€/mes</option>
              <option value="core" selected>Core · 1.800€ + 199€/mes</option>
              <option value="scale">Scale · 4.500€ + 449€/mes</option>
              <option value="elite">Elite · 8.500€ + 799€/mes</option>
            </select>
          </div>
        </div>
        <div class="field"><label>URL web del cliente</label><input name="url_web" placeholder="https://cliente.com"></div>
        <div class="field"><label>Dolor principal</label><textarea name="dolor_principal" placeholder="Pierde llamadas fuera de horario, no contesta WhatsApp a tiempo…"></textarea></div>
        <div class="grid2">
          <div class="field"><label>Presupuesto mensual (€)</label><input type="number" name="presupuesto_mensual" min="0" placeholder="300"></div>
          <div class="field"><label>Notas</label><input name="notas" placeholder="De la llamada…"></div>
        </div>
        <button type="submit" class="btn primary" id="genBtn">⚡ Generar Propuesta IA</button>
      </form>
    </div>

    <!-- Preview -->
    <div class="card">
      <div class="preview-head">
        <h2 style="margin:0">Vista previa</h2>
        <div class="acts">
          <button class="btn ghost sm" id="copyBtn" disabled>📋 Copiar HTML</button>
          <button class="btn ghost sm" id="pdfBtn" disabled>🖨️ Imprimir / PDF</button>
          <button class="btn accent sm" id="saveBtn" disabled>💾 Guardar</button>
        </div>
      </div>
      <div id="previewBox">
        <div class="ph"><div class="big">📄</div><div>La propuesta generada aparecerá aquí.<br>Rellena el formulario y pulsa <b>Generar Propuesta IA</b>.</div></div>
      </div>
    </div>
  </div>

  <p class="section-title">Propuestas guardadas</p>
  <div class="list" id="list"><div class="loading">Cargando…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA = "https://mlaqtniujnvfxcvcourm.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sYXF0bml1am52ZnhjdmNvdXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzUyMzIsImV4cCI6MjA5MzQxMTIzMn0.Neh7VUS8ADsxf0DPab0JoJyGXOAXnLIaXzXbKzj2BGs";
const REST = SUPA + "/rest/v1/";
const FN = SUPA + "/functions/v1/";
const H = { apikey: ANON, Authorization: "Bearer " + ANON, "Content-Type": "application/json" };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let currentHtml = "";
let currentData = null;

function toast(msg, kind){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show " + (kind || "");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = "toast", 3000);
}

async function api(path, opts){
  const r = await fetch(REST + path, { headers: H, ...opts });
  if (!r.ok) throw new Error("HTTP " + r.status + " — " + await r.text());
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

function showPreview(html){
  const box = $("#previewBox");
  box.innerHTML = '<div class="frame-wrap"><iframe id="frame"></iframe></div>';
  $("#frame").srcdoc = html;
  $("#copyBtn").disabled = false;
  $("#pdfBtn").disabled = false;
  $("#saveBtn").disabled = false;
}

/* ---------- generate ---------- */
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = {
    nombre_cliente: (fd.get("nombre_cliente") || "").trim(),
    empresa: (fd.get("empresa") || "").trim(),
    sector: fd.get("sector") || "",
    pack: fd.get("pack") || "core",
    url_web: (fd.get("url_web") || "").trim(),
    dolor_principal: (fd.get("dolor_principal") || "").trim(),
    presupuesto_mensual: fd.get("presupuesto_mensual") ? parseInt(fd.get("presupuesto_mensual"), 10) : null,
    notas: (fd.get("notas") || "").trim(),
  };
  const btn = $("#genBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Generando…';
  try{
    const r = await fetch(FN + "propuesta-generator", { method: "POST", headers: H, body: JSON.stringify(data) });
    const j = await r.json();
    if (!r.ok || !j.html) throw new Error(j.error || j.details || "Sin HTML");
    currentHtml = j.html;
    currentData = data;
    showPreview(currentHtml);
    toast("Propuesta generada ✅", "ok");
  }catch(err){
    toast("Error: " + err.message, "err");
  }finally{
    btn.disabled = false;
    btn.innerHTML = "⚡ Generar Propuesta IA";
  }
});

/* ---------- copy / pdf / save ---------- */
$("#copyBtn").addEventListener("click", async () => {
  try{ await navigator.clipboard.writeText(currentHtml); toast("HTML copiado al portapapeles ✅", "ok"); }
  catch{ toast("No se pudo copiar (permisos del navegador)", "err"); }
});

$("#pdfBtn").addEventListener("click", () => {
  const f = $("#frame");
  if (f && f.contentWindow){ f.contentWindow.focus(); f.contentWindow.print(); }
});

$("#saveBtn").addEventListener("click", async () => {
  if (!currentData || !currentHtml) return;
  const btn = $("#saveBtn");
  btn.disabled = true;
  try{
    await api("propuestas", {
      method: "POST",
      headers: { ...H, Prefer: "return=minimal" },
      body: JSON.stringify({ ...currentData, html_generado: currentHtml, estado: "borrador" }),
    });
    toast("Guardada en Supabase ✅", "ok");
    await loadList();
  }catch(err){ toast("Error guardando: " + err.message, "err"); }
  finally{ btn.disabled = false; }
});

/* ---------- list ---------- */
async function loadList(){
  const list = $("#list");
  try{
    const rows = await api("propuestas?select=*&order=created_at.desc") || [];
    if (!rows.length){ list.innerHTML = '<div class="loading">Aún no hay propuestas guardadas.</div>'; return; }
    list.innerHTML = rows.map(p => {
      const fecha = new Date(p.created_at).toLocaleDateString("es-ES");
      return '<div class="row" data-id="' + p.id + '">' +
          '<div class="info">' +
            '<div class="nm">' + esc(p.empresa || p.nombre_cliente || "—") + '</div>' +
            '<div class="mt">' +
              (p.nombre_cliente ? '<span>' + esc(p.nombre_cliente) + '</span>' : '') +
              (p.pack ? '<span class="tag pack">' + esc(p.pack) + '</span>' : '') +
              (p.sector ? '<span class="tag sector">' + esc(p.sector) + '</span>' : '') +
              '<span>' + fecha + '</span>' +
            '</div>' +
          '</div>' +
          '<select class="estado-sel ' + esc(p.estado) + '" data-id="' + p.id + '">' +
            ['borrador','enviada','aceptada','rechazada'].map(s =>
              '<option value="' + s + '"' + (s === p.estado ? ' selected' : '') + '>' + s + '</option>').join('') +
          '</select>' +
          '<button class="btn ghost sm view-btn" data-id="' + p.id + '">👁 Ver</button>' +
        '</div>';
    }).join("");

    list.querySelectorAll(".view-btn").forEach(b =>
      b.addEventListener("click", () => {
        const p = rows.find(x => x.id === b.dataset.id);
        if (p && p.html_generado){ currentHtml = p.html_generado; currentData = p; showPreview(p.html_generado); window.scrollTo({top:0,behavior:"smooth"}); }
      }));
    list.querySelectorAll(".estado-sel").forEach(sel =>
      sel.addEventListener("change", async () => {
        try{
          await api("propuestas?id=eq." + sel.dataset.id, {
            method: "PATCH", headers: { ...H, Prefer: "return=minimal" },
            body: JSON.stringify({ estado: sel.value }),
          });
          sel.className = "estado-sel " + sel.value;
          toast("Estado actualizado", "ok");
        }catch(err){ toast("Error actualizando estado", "err"); }
      }));
  }catch(e){
    list.innerHTML = '<div class="loading">Error cargando propuestas.<br><small>' + esc(e.message) + '</small></div>';
  }
}

loadList();
</script>
</body>
</html>
